# aikeytake-zog — library server (Docker Compose)
#
#   cd deploy && docker compose up -d --build
#   # set the web password / create a token once:
#   docker compose run --rm aikeytake-zog set-password
#   docker compose run --rm aikeytake-zog create-token agent-x --scope write
#
# The data directory is the named volume `aikeytake-zog-data`. Back it up with:
#   docker run --rm -v deploy_aikeytake-zog-data:/data alpine tar czf - -C /data . > aikeytake-zog-backup.tar.gz

services:
  aikeytake-zog:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: aikeytake-zog
    environment:
      AIKEYTAKE_ZOG_DATA_DIR: /data
      # AIKEYTAKE_ZOG_COOKIE_SECURE: "1"   # enable when behind HTTPS
    volumes:
      - aikeytake-zog-data:/data
    ports:
      # bound to the host loopback; expose publicly via a reverse proxy if needed
      - "127.0.0.1:8321:8321"
    restart: unless-stopped

volumes:
  aikeytake-zog-data:
